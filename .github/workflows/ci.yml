# .github/workflows/ci.yml
#
# CI (Integracion Continua) muy simple: en cada Pull Request, instala las
# dependencias, levanta el servidor y verifica que las paginas y la API
# principales respondan correctamente. No necesita ninguna clave de API -
# solo confirma que el servidor arranca y sirve lo basico, sin probar la
# extraccion real con Claude (eso tendria costo y requeriria un secreto).

name: CI - Prueba de humo

on:
  pull_request:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar dependencias
        run: npm install

      - name: Arrancar el servidor
        run: npm start &

      - name: Esperar a que el servidor responda
        run: |
          for i in $(seq 1 10); do
            if curl -s -o /dev/null http://localhost:3100/; then
              echo "Servidor arriba."
              exit 0
            fi
            sleep 1
          done
          echo "El servidor no respondio a tiempo."
          exit 1

      - name: Verificar pagina principal (/)
        run: |
          codigo=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3100/)
          echo "Codigo recibido: $codigo"
          test "$codigo" = "200"

      - name: Verificar paginas estaticas del dashboard
        run: |
          for pagina in presion.html composicion.html subir.html historial.html; do
            codigo=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3100/$pagina")
            echo "$pagina -> $codigo"
            test "$codigo" = "200"
          done

      - name: Verificar API de presion arterial
        run: |
          codigo=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3100/api/presion)
          echo "Codigo recibido: $codigo"
          test "$codigo" = "200"

      - name: Verificar API de composicion corporal
        run: |
          codigo=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3100/api/composicion)
          echo "Codigo recibido: $codigo"
          test "$codigo" = "200"
